<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E5AA8" />
      <stop offset="50%" stop-color="#2D72D6" />
      <stop offset="100%" stop-color="#1E5AA8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E5AA8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Car Silhouette: Upper Roofline & Hood (Royal Blue) -->
  <g filter="url(#subtleGlow)">
    <!-- Roof to Trunk curve -->
    <path d="M 330 115 C 380 90, 480 88, 550 118 C 580 120, 640 135, 690 152" 
          fill="none" stroke="#1E5AA8" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Nose / Hood curve -->
    <path d="M 120 178 C 122 174, 128 172, 134 172 C 142 165, 175 152, 230 148 C 310 147, 430 144, 490 148" 
          fill="none" stroke="#1E5AA8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Front light / bumper detail -->
    <path d="M 120 178 L 132 186 L 128 200" 
          fill="none" stroke="#1E5AA8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Front Wheel Arch Upper (Blue) -->
    <path d="M 190 200 C 190 166, 260 166, 260 200" 
          fill="none" stroke="#1E5AA8" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Rear Wheel Arch Upper (Blue) -->
    <path d="M 545 198 C 545 163, 625 163, 625 198" 
          fill="none" stroke="#1E5AA8" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Car Silhouette: Lower Groundline & Accents (Metallic Gold) -->
  <g>
    <!-- Front under-lip to rear diffuser rocker panel -->
    <path d="M 132 206 C 180 216, 260 214, 330 206 C 420 196, 500 198, 550 203 C 600 205, 650 206, 686 182" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Front Wheel Inner Accent (Gold) -->
    <path d="M 198 204 C 205 178, 248 178, 255 204" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rear Wheel Inner Accent (Gold) -->
    <path d="M 552 201 C 560 174, 615 174, 622 201" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: TRUE WHEEL MOTORS -->
  <text x="400" y="252" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="34" 
        font-weight="600" 
        letter-spacing="9" 
        text-anchor="middle" 
        fill="#FFFFFF">
    TRUE WHEEL MOTORS
  </text>

  <!-- Divider Line with Diamond Accent -->
  <line x1="220" y1="272" x2="375" y2="272" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <circle cx="400" cy="272" r="3.5" fill="#D4AF37"/>
  <line x1="425" y1="272" x2="580" y2="272" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Tagline: Driven From Japan, Delivered With Trust -->
  <text x="400" y="295" 
        font-family="'Playfair Display', 'Georgia', serif" 
        font-size="16" 
        font-style="italic" 
        letter-spacing="3.5" 
        text-anchor="middle" 
        fill="#D4AF37">
    Driven From Japan, Delivered With Trust
  </text>
</svg>
